name: Publicar presentación + laboratorio marimo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1) BUILD: prepara el sitio (presentación + export WASM marimo)
  # ──────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar marimo
        run: pip install --quiet --upgrade marimo

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7

      - name: Ver versiones instaladas
        run: |
          echo "Python:  $(python --version)"
          echo "marimo:  $(marimo --version)"
          echo "uv:      $(uv --version)"

      - name: Comprobar que existe la presentación
        run: |
          if [ ! -f tema1_clase.html ]; then
            echo "⚠ No se encontró tema1_clase.html (se publicará sin presentación)."
          else
            echo "✔ Presentación encontrada: tema1_clase.html"
          fi

      - name: Comprobar que existe el cuaderno marimo
        run: |
          if [ ! -f tema1_terminal.py ]; then
            echo "❌ No se encontró tema1_terminal.py en la raíz del repositorio."
            exit 1
          fi
          echo "✔ Cuaderno encontrado: tema1_terminal.py"

      - name: Validar compatibilidad WASM (informativo)
        run: |
          echo "=== marimo check (solo avisos WASM) ==="
          marimo check tema1_terminal.py --select MW || true

      - name: Preparar carpeta del sitio
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/

      - name: Exportar cuaderno marimo a WASM
        run: |
          set -e
          echo "=== Exportando tema1_terminal.py → _site/tema1_terminal.html ==="
          marimo export html-wasm tema1_terminal.py \
            -o _site/tema1_terminal.html \
            --mode run \
            --single-file
          echo "=== Resultado del export ==="
          ls -lh _site/tema1_terminal.html

      - name: Crear index.html de índice si falta
        run: |
          if [ ! -f _site/index.html ]; then
            cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <title>HealthTech · Clase 1</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 40rem;
                     margin: 4rem auto; padding: 0 1rem; line-height: 1.6; }
              a { display: block; padding: .75rem 1rem; margin: .5rem 0;
                  border: 1px solid #ccc; border-radius: .5rem;
                  text-decoration: none; color: #0366d6; }
              a:hover { background: #f0f6ff; }
            </style>
          </head>
          <body>
            <h1>HealthTech · Clase 1</h1>
            <a href="./tema1_clase.html">📊 Presentación (Tema 1)</a>
            <a href="./tema1_terminal.html">🧪 Laboratorio interactivo (marimo)</a>
          </body>
          </html>
          EOF
          fi

      - name: Desactivar procesado Jekyll
        run: touch _site/.nojekyll

      - name: Listar el sitio antes de subirlo (diagnóstico)
        run: |
          echo "=== Contenido de _site/ ==="
          ls -laR _site | head -60

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ──────────────────────────────────────────────────────────────
  # 2) DEPLOY: publica el artefacto en GitHub Pages
  # ──────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
